name: Daily Scrape Update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the scrape script
        run: python scrape_steamrip.py

      - name: Check All.Games.json
        run: |
          if [ ! -f All.Games.json ]; then
            echo "All.Games.json does not exist!";
            exit 1;
          fi

      - name: Validate All.Games.json
        run: |
          if ! python -m json.tool All.Games.json > /dev/null; then
            echo "All.Games.json is not valid JSON!";
            exit 1;
          fi
          echo "All.Games.json is valid JSON."
          if [ -f New.Games.json ]; then
            if ! python -m json.tool New.Games.json > /dev/null; then
              echo "New.Games.json is not valid JSON!";
              exit 1;
            fi
            echo "New.Games.json is valid JSON."
          fi

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add *.json
          git diff-index --quiet HEAD || git commit -m "Update JSON files from scrape_steamrip.py"
          git push
